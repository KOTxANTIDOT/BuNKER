name: Build BunkerKot APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o BunkerKotAndroid_v1.5.0_lists_slim.zip -d extracted

      - name: Build APK
        working-directory: extracted/BunkerKotAndroid
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkerKot-debug
          path: extracted/BunkerKotAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
