name: Build BunkerKot APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o BunkerKotAndroid_v1.5.0_lists_slim.zip -d extracted

      - name: Build arm64 APK
        working-directory: extracted/BunkerKotAndroid
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Find APK
        run: |
          find extracted/BunkerKotAndroid/app/build/outputs -type f -name "*.apk" -print

          APK=$(find extracted/BunkerKotAndroid/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK не найден"
            exit 1
          fi

          cp "$APK" BunkerKot-arm64-debug.apk

          ls -lh BunkerKot-arm64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BunkerKot-arm64-debug
          path: BunkerKot-arm64-debug.apk
          if-no-files-found: error
