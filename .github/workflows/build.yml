name: Build Bunker Kot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find project archive
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'BunkerKotAndroid_v*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project archive not found."
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"

          rm -rf BunkerKotAndroid
          unzip -q "$ZIP_FILE"

          if [ -d "BunkerKotAndroid/BunkerKotAndroid" ]; then
            mv BunkerKotAndroid/BunkerKotAndroid BunkerKotAndroid_tmp
            rm -rf BunkerKotAndroid
            mv BunkerKotAndroid_tmp BunkerKotAndroid
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_TOOLS="$ANDROID_HOME/cmdline-tools"

          mkdir -p "$CMDLINE_TOOLS"

          curl -L \
            -o /tmp/commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q /tmp/commandlinetools.zip -d "$CMDLINE_TOOLS"

          mv "$CMDLINE_TOOLS/cmdline-tools" "$CMDLINE_TOOLS/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$CMDLINE_TOOLS/latest/bin/sdkmanager" --licenses > /dev/null || true

          "$CMDLINE_TOOLS/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: BunkerKotAndroid
        run: chmod +x gradlew

      - name: Build ARM64 APK
        working-directory: BunkerKotAndroid
        run: |
          ./gradlew clean assembleArm64V8aRelease --stacktrace

      - name: Find APK
        working-directory: BunkerKotAndroid
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bunker-Kot-ARM64
          path: BunkerKotAndroid/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
